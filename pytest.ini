[pytest]
# pytest 的统一配置。有这个文件后，命令行不用每次加参数，
# 且 CI 和本地跑的是同一份配置。

# -v 显示每条用例名；--tb=short 失败时只打印关键栈（太长反而看不清）
addopts = -v --tb=short

# 终端实时显示日志（不用每次记着加 -s）
# 注意：这里只影响"终端"，文件落盘由 conftest.py 的 FileHandler 负责
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(name)s: %(message)s

# 日志也写进文件（pytest 自带能力，与 conftest 的 FileHandler 二选一即可。
# 这里关掉，统一用 conftest 的方式，避免同一份日志写两次）
log_file =
log_file_level = INFO

markers=
    smoke: 核心冒烟用例，提交前必须跑
    regression: 完整回归用力
